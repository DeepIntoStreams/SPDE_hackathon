# - Phi42+_xi_u0_eps8_sigma0.1_seed42_1200.h5
# - Phi42+_xi_u0_eps32_sigma0.1_seed42_1200.h5
# - Phi42+_xi_u0_eps64_sigma0.1_seed42_1200.h5
