model: NSPDE-S
equation: Phi42+
mode: train_1200 # train_1200 or eval_mean_std
eval_samples_per_split: 500 # eval_mean_std needs eval_data_path or data_path_1500
seed: 3407

ntrain: 840
ntest: 180
nval: 180
sub_x: 1
batch_size: 10
T: 1000
sub_t: 5
hidden_channels: 32  # d_h
n_iter: 1  # [1, 2, 3, 4]
modes1: 16  # [8, 16]
modes2: 16  # [8, 16]
modes3: 8  # [8, 16]
solver: 'fixed_point'
epochs: 1000
learning_rate: 0.001
weight_decay: 1e-4
# scheduler_step: 100
# scheduler_gamma: 0.5
plateau_patience: 50
delta: 0.0002
plateau_terminate: 100
print_every: 20  # 10

save_dir: '../result/${model}_${equation}/'
checkpoint_file: '${data}.pth'
# checkpoint_file: 'Phi42+_reno_xi_u0_epsmixed_1200.pth'

log_file: '${data}_log'

data_root: /root/autodl-tmp/results/Phi42+
data: Phi42+_xi_u0_eps2_sigma0.1_seed42_1200
data_path: /root/autodl-tmp/results/Phi42+/Phi42+_xi_u0_eps2_sigma0.1_seed42_1200.h5

# Optional path for mode=eval_mean_std. It must contain at least
# 5 * eval_samples_per_split samples. If this is null, set data_path_1500
# to use the original 1200+1500 evaluation split.
eval_data_path: /root/autodl-tmp/results/Phi42+/Phi42+_xi_u0_eps2_sigma0.1_seed42_1200.h5
data_path_1500: null

# Leave datasets empty/null to run the single data_path above.
# Fill this list only when you want train2d_aeps.py to loop over multiple eps files.
datasets: null
