model: NSPDE
equation: Phi42+
mode: train_1200 # train_1200 or eval_mean_std
eval_samples_per_split: 200 # eval_mean_std needs 5 * 500 samples in eval_data_path
seed: 3407

ntrain: 840
ntest: 180
nval: 180
sub_x: 1
batch_size: 10
T: 1000
sub_t: 5
hidden_channels: 32  # d_h
n_iter: 2  # [1, 2, 3, 4]
modes1: 16  # [8, 16]
modes2: 8  # [8, 16]
modes3: 8  # [8, 16]
solver: 'fixed_point'
epochs: 1000
learning_rate: 0.001
weight_decay: 1e-4
# scheduler_step: 100
# scheduler_gamma: 0.5
plateau_patience: 50
delta: 0.0002
plateau_terminate: 100
print_every: 20  # 10

save_dir: '../result/${model}_${equation}/'
checkpoint_file: '${data}.pth'
# checkpoint_file: 'Phi42+_reno_xi_u0_epsmixed_1200.pth'

log_file: '${data}_log'

data: Phi42+_reno_xi_u0_epsmixed_1200
data_path: /root/autodl-tmp/results/Phi42+/Phi42+_reno_xi_u0_epsmixed_1200.h5

# Optional path for mode=eval_mean_std. It must contain at least
# 5 * eval_samples_per_split samples. The 1200-sample training file above
# is not enough for the default 5x500 evaluation.
eval_data_path: /root/autodl-tmp/results/Phi42+/Phi42+_reno_xi_u0_epsmixed_1200.h5
data_path_1500: null

# Leave datasets empty/null to run the single data_path above.
# Fill this list only when you want train2d.py to loop over multiple datasets.
datasets: null
# - Phi42+_reno_xi_u0_eps2_1200
# - Phi42+_reno_xi_u0_eps8_1200
# - Phi42+_reno_xi_u0_eps32_1200
# - Phi42+_reno_xi_u0_eps64_1200
# - Phi42+_reno_xi_u0_eps128_1200

